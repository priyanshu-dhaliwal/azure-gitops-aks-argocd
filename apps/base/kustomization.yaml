# Shared workload manifests. Environment differences live in overlays, so a diff
# between dev and prod is a diff of intent, not of code.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - serviceaccount.yaml
  - external-secret.yaml
  - networkpolicy.yaml
  - pdb.yaml
commonLabels:
  app.kubernetes.io/part-of: gitops-platform
