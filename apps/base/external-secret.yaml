# Secrets are pulled from Key Vault at runtime. Nothing secret is ever committed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: app-database-url
    - secretKey: API_KEY
      remoteRef:
        key: app-api-key
