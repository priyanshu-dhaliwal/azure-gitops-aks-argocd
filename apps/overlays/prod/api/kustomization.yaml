apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api
namePrefix: api-
resources:
  - ../../base
  - rollout.yaml
# Prod uses the Rollout (rollout.yaml) for progressive delivery; the base
# Deployment is not applied so the two do not compete for the same pods.
images:
  - name: app
    newName: gitp-prod-acr.azurecr.io/api
    newTag: "0.1.0"          # pinned: never :latest (Kyverno enforces)
patches:
  # The Rollout owns the pods in prod; the base Deployment is deleted.
  - target:
      kind: Deployment
      name: app
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
        namespace: api
  - target:
      kind: Rollout
      name: api-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.example.com
      - op: replace
        path: /spec/rules/0/host
        value: api.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
  - target:
      kind: ServiceAccount
      name: app
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: REPLACE_WITH_PROD_API_CLIENT_ID

