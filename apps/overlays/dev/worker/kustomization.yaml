apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worker
namePrefix: worker-
resources:
  - ../../base
images:
  - name: app
    newName: gito-dev-acr.azurecr.io/worker
    newTag: "0.1.0"          # pinned: never :latest (Kyverno enforces)
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
  - target:
      kind: Ingress
      name: app
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: worker.dev.example.com
      - op: replace
        path: /spec/rules/0/host
        value: worker.dev.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target:
      kind: ServiceAccount
      name: app
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: REPLACE_WITH_DEV_WORKER_CLIENT_ID
