# Kyverno — admission policy.
#
# Wave -7: BEFORE workloads (wave 1+). An admission controller installed after
# the workloads is a policy that polices nothing until the next deploy.
#
# validationFailureAction: Enforce — these are not suggestions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.4
    helm:
      values: |
        crds:
          install: true
        replicaCount: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        # Kyverno's own webhooks must not block cluster bootstrap.
        features:
          admissionReports:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
