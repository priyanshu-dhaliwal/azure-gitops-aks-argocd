<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b949e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#0d1117"/>
  <text x="28" y="38" fill="#e6edf3" font-size="22" font-weight="600">GitOps AKS Platform with ArgoCD</text>
  <text x="28" y="60" fill="#8b949e" font-size="13">Git is the only path to the cluster · Terraform owns Azure · Argo owns Kubernetes · sync waves make bootstrap deterministic</text>

  <!-- developer -->
  <circle cx="48" cy="140" r="22" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <text x="48" y="145" fill="#c9d1d9" font-size="9" text-anchor="middle">dev</text>

  <!-- PR + CI -->
  <rect x="92" y="104" width="200" height="72" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="192" y="126" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">PR + CI</text>
  <text x="104" y="144" fill="#c9d1d9" font-size="9.5">kustomize build every overlay</text>
  <text x="104" y="158" fill="#c9d1d9" font-size="9.5">kubeconform · conftest · no-secrets</text>
  <text x="104" y="170" fill="#6e7681" font-size="9">a manifest that cannot render never lands</text>
  <line x1="72" y1="140" x2="88" y2="140" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- git -->
  <rect x="330" y="104" width="200" height="72" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="430" y="126" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">Git · main</text>
  <text x="342" y="144" fill="#c9d1d9" font-size="9.5">clusters/{dev,prod}/*.yaml</text>
  <text x="342" y="158" fill="#c9d1d9" font-size="9.5">platform/** · apps/**</text>
  <text x="342" y="170" fill="#6e7681" font-size="9">the single source of truth</text>
  <line x1="292" y1="140" x2="326" y2="140" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- argocd -->
  <rect x="572" y="96" width="250" height="88" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="697" y="118" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">ArgoCD</text>
  <text x="584" y="136" fill="#c9d1d9" font-size="9.5">polls main every 3 min (+ webhook)</text>
  <text x="584" y="150" fill="#c9d1d9" font-size="9.5">admin disabled · OIDC via Entra ID</text>
  <text x="584" y="166" fill="#3fb950" font-size="9.5">selfHeal · prune · app-of-apps</text>
  <text x="584" y="178" fill="#6e7681" font-size="9">admin group = access to production</text>
  <line x1="530" y1="140" x2="568" y2="140" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cluster -->
  <rect x="572" y="220" width="250" height="470" rx="9" fill="none" stroke="#a371f7" stroke-width="1.5"/>
  <text x="697" y="244" fill="#a371f7" font-size="12" font-weight="600" text-anchor="middle">AKS · Terraform-provisioned</text>

  <text x="588" y="270" fill="#6e7681" font-size="9.5">platform  (waves −10 → −6)</text>
  <rect x="588" y="278" width="218" height="26" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="295" fill="#c9d1d9" font-size="9.5">−10 ingress-nginx</text>
  <rect x="588" y="308" width="218" height="26" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="325" fill="#c9d1d9" font-size="9.5">−9  cert-manager (CRDs + issuers)</text>
  <rect x="588" y="338" width="218" height="26" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="355" fill="#c9d1d9" font-size="9.5">−8  external-secrets (CRDs)</text>
  <rect x="588" y="368" width="218" height="26" rx="4" fill="#0b1020" stroke="#f85149"/>
  <text x="600" y="385" fill="#f85149" font-size="9.5">−7  kyverno (Enforce)</text>
  <rect x="588" y="398" width="218" height="26" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="415" fill="#c9d1d9" font-size="9.5">−6  kube-prometheus-stack</text>

  <text x="588" y="446" fill="#6e7681" font-size="9.5">workloads  (waves 1 → 2)</text>
  <rect x="588" y="454" width="218" height="26" rx="4" fill="#0b1020" stroke="#3fb950"/>
  <text x="600" y="471" fill="#3fb950" font-size="9.5">1  api (Rollout in prod)</text>
  <rect x="588" y="484" width="218" height="26" rx="4" fill="#0b1020" stroke="#3fb950"/>
  <text x="600" y="501" fill="#3fb950" font-size="9.5">2  worker</text>

  <text x="588" y="532" fill="#6e7681" font-size="9.5">identity</text>
  <rect x="588" y="540" width="218" height="40" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="556" fill="#c9d1d9" font-size="9">ServiceAccount → federated MI</text>
  <text x="600" y="570" fill="#6e7681" font-size="9">no secret in-cluster, ever</text>

  <rect x="588" y="590" width="218" height="40" rx="4" fill="#0b1020" stroke="#30363d"/>
  <text x="600" y="606" fill="#c9d1d9" font-size="9">external-secrets → Key Vault</text>
  <text x="600" y="620" fill="#6e7681" font-size="9">private endpoint · workload identity</text>

  <rect x="588" y="640" width="218" height="34" rx="4" fill="#0b1020" stroke="#d29922"/>
  <text x="600" y="661" fill="#d29922" font-size="9">AKS local accounts: disabled</text>
  <line x1="697" y1="184" x2="697" y2="216" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- terraform boundary -->
  <rect x="870" y="96" width="342" height="180" rx="7" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="1041" y="120" fill="#d29922" font-size="12" font-weight="600" text-anchor="middle">Terraform owns (Azure API)</text>
  <g font-size="9.5" fill="#c9d1d9">
    <text x="884" y="142">AKS cluster · node pools · zones</text>
    <text x="884" y="160">VNet · Azure Firewall · forced tunnelling</text>
    <text x="884" y="178">ACR · Key Vault + private endpoint</text>
    <text x="884" y="196">Log Analytics · Container Insights</text>
    <text x="884" y="214">user-assigned MIs + federated credentials</text>
    <text x="884" y="232">ArgoCD bootstrap (once, then hands over)</text>
  </g>
  <text x="884" y="258" fill="#f85149" font-size="9">never Kubernetes objects — one owner per object</text>

  <!-- kyverno policies -->
  <rect x="870" y="300" width="342" height="180" rx="7" fill="#0b1020" stroke="#f85149" stroke-width="1.5"/>
  <text x="1041" y="324" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">Kyverno · Enforce (wave −7)</text>
  <g font-size="9.5" fill="#c9d1d9">
    <text x="884" y="346">require owner + cost-centre labels</text>
    <text x="884" y="364">require cpu/memory requests + limits</text>
    <text x="884" y="382">disallow :latest image tags</text>
    <text x="884" y="400">disallow privileged / hostPath / hostNetwork</text>
    <text x="884" y="418">restrict images to the platform ACR</text>
  </g>
  <text x="884" y="444" fill="#6e7681" font-size="9">installed BEFORE workloads — a policy added after them polices nothing</text>
  <text x="884" y="462" fill="#6e7681" font-size="9">conftest runs the same rules in CI, so a PR fails before merge</text>
  <path d="M 866 390 C 840 390 840 300 826 300" fill="none" stroke="#f85149" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- progressive delivery -->
  <rect x="870" y="510" width="342" height="130" rx="7" fill="#0b1020" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1041" y="534" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">Progressive delivery (prod only)</text>
  <text x="884" y="556" fill="#c9d1d9" font-size="9.5">Argo Rollouts: 10% → 50% → 100%</text>
  <text x="884" y="574" fill="#c9d1d9" font-size="9.5">gated on nginx success rate ≥ 99%</text>
  <text x="884" y="592" fill="#6e7681" font-size="9">failureLimit 2 → automatic rollback to the</text>
  <text x="884" y="606" fill="#6e7681" font-size="9">previous ReplicaSet, not a manual revert</text>
  <text x="884" y="626" fill="#3fb950" font-size="9">dev keeps a plain Deployment — cheaper, faster</text>

  <!-- properties strip -->
  <rect x="28" y="716" width="1184" height="62" rx="7" fill="#0b1020" stroke="#30363d"/>
  <text x="44" y="738" fill="#e6edf3" font-size="11" font-weight="600">verify-gitops.sh asserts 8 properties, and CI fails the PR if a manifest breaks any of them</text>
  <g font-size="9" fill="#8b949e">
    <text x="44" y="760">no local accounts · admin disabled · all Synced · selfHeal on · kyverno enforcing · no Secrets in namespaces · owner labels · only main</text>
  </g>
</svg>
